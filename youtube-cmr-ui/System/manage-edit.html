<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>add manual gateway</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>
   

    <main class="main-content">
        <div class="container-fluid">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
    <h5 class="fw-700">Manage Home Sections</h5>

  </div>

  <div class="bg-white border-main rounded-20 p-4 shadow-sm mb-4">

  <form id="categoryForm">

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label mb-2">
          Page Name <span class="text-danger">*</span>
        </label>

        <input
          type="text"
          class="form-control premium-input shadow-none"
          placeholder="Enter name"
          required
        />
      </div>

      <div class="col-md-6">
        <label class="form-label mb-2">
          Slug <span class="text-danger">*</span>
        </label>

        <input
          type="text"
          class="form-control premium-input shadow-none"
          placeholder="Enter slug"
          required
        />
      </div>

      <div class="col-md-6 mt-2">
        <button
          type="submit"
          class="btn w-full bg-primary text-white px-4 py-2 rounded-12 fw-600 shadow-sm border-0"
        >
          Submit
        </button>
      </div>

    </div>

  </form>

</div>

<div class="row g-4">

  <!-- LEFT SIDE (ACTIVE SECTIONS) -->
  <div class="col-lg-7">

    <div class="bg-white border-main rounded-12 p-4 shadow-sm">

      <h6 class="fw-700 mb-3">Active Sections</h6>

      <div id="activeSections" class="d-flex flex-column gap-2">

        <div class="section-card border-main rounded-10 p-3 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2 fw-600">
            <span class="text-muted">☰</span>
            Capabilities
          </div>

          <button class="btn btn-sm text-danger delete-btn">
                  <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                      >
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14H6L5 6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                        <path d="M9 6V4h6v2"></path>
                      </svg>
          </button>
        </div>

        <div class="section-card border-main rounded-10 p-3  d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2 fw-600">
            <span class="text-muted">☰</span>
            About Us
          </div>

          <button class="btn btn-sm text-danger delete-btn">
                  <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                      >
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14H6L5 6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                        <path d="M9 6V4h6v2"></path>
                      </svg>
          </button>
        </div>

        <div class="section-card border-main rounded-10 p-3 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2 fw-600">
            <span class="text-muted">☰</span>
            Features
          </div>

          <button class="btn btn-sm text-danger delete-btn">
                  <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                      >
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14H6L5 6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                        <path d="M9 6V4h6v2"></path>
                      </svg>
          </button>
        </div>

      </div>
      <button class="btn bg-primary text-white mt-3 p-3 w-100">Update</button>

    </div>

  </div>


  <!-- RIGHT SIDE (AVAILABLE SECTIONS) -->
  <div class="col-lg-5">

    <div class="bg-white border-main rounded-12 p-4 shadow-sm">

      <h6 class="fw-700 mb-2">Available Sections</h6>

      <p class="text-muted fs-0-9 mb-3">
        Drag sections to the left panel to enable them.
      </p>

      <div id="availableSections" class="d-flex flex-column gap-2">

        <div class="section-card border-main rounded-10 p-3 bg-white d-flex justify-content-between align-items-center" draggable="true">
          <div class="fw-600">
            Blog Section
          </div>

          <button class="btn btn-sm text-primary">
            ⚙
          </button>
        </div>

        <div class="section-card border-main rounded-10 p-3 bg-white d-flex justify-content-between align-items-center" draggable="true">
          <div class="fw-600">
            Brand Section
          </div>

          <button class="btn btn-sm text-primary">
            ⚙
          </button>
        </div>

        <div class="section-card border-main rounded-10 p-3 bg-white d-flex justify-content-between align-items-center" draggable="true">
          <div class="fw-600">
            FAQ Section
          </div>

          <button class="btn btn-sm text-primary">
            ⚙
          </button>
        </div>

      </div>

    </div>

  </div>

</div>

</div>
    </main>

    


    <script>
        const availableSections = document.getElementById("availableSections");
const activeSections = document.getElementById("activeSections");

let draggedItem = null;


// drag start (only right side)
availableSections.addEventListener("dragstart", function (e) {

  const card = e.target.closest(".section-card");

  if (!card) return;

  draggedItem = card;

});


// allow drop
activeSections.addEventListener("dragover", function (e) {
  e.preventDefault();
});


// drop event
activeSections.addEventListener("drop", function () {

  if (!draggedItem) return;

  const clone = draggedItem.cloneNode(true);

  // convert gear button → delete
  const btn = clone.querySelector("button");

  if (btn) {

    btn.innerHTML = `      <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                      >
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14H6L5 6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                        <path d="M9 6V4h6v2"></path>
                      </svg>`;

    btn.classList.remove("text-primary");

    btn.classList.add("text-danger");

    btn.classList.add("delete-btn");

  }

  activeSections.appendChild(clone);

  draggedItem = null;

});



// delete section
document.addEventListener("click", function (e) {

  const deleteBtn = e.target.closest(".delete-btn");

  if (!deleteBtn) return;

  deleteBtn.closest(".section-card").remove();

});
    </script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
