          <!-- Modals -->
    <!-- Add/Update Category Modal -->
    <div
      class="modal fade"
      id="categoryModal"
      tabindex="-1"
      aria-labelledby="categoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-20">
          <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
            <h5 class="modal-title fw-700 text-dark" id="categoryModalLabel">
                Add New Page
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body px-4 py-4">
            <form id="categoryForm">
              <div class="mb-4">
                <label for="categoryName" class="form-label mb-2"
                  >Page Name
 <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control premium-input shadow-none"
                  id="categoryName"
                  placeholder="Enter name"
                  required
                />
              </div>
              <div class="mb-4">
                <label for="categoryDescription" class="form-label mb-2"
                  >Slug <span class="text-danger">*</span></label
                >
                <input
                  class="form-control premium-input shadow-none"
                  id="categoryDescription"
                  placeholder="Enter slug"
                  required
                />
              </div>
              <button
                type="submit"
                class="btn btn-primary w-100 py-3 rounded-12 fw-600 shadow-sm border-0 bg-primary"
              >
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>


      <!-- Confirmation Modal -->
      <div
        class="modal fade"
        id="confirmationModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-12 border-0 shadow-lg bg-white">
            <div
              class="modal-header border-bottom px-4 py-3 bg-white rounded-top-12 d-flex justify-content-between align-items-center"
            >
              <h5 class="modal-title fw-800 text-danger m-0 fs-5">
                Confirmation Alert!
              </h5>
              <button
                type="button"
                class="btn-close shadow-none"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body px-4 py-4">
              <p
                class="text-muted mb-4 text-center px-4"
                id="confirmationModalBody"
              >
Are you sure to remove this page?

              </p>
              <div class="d-flex gap-3 mt-4">
                <button
                  type="button"
                  class="btn btn-light bg-light rounded-8 fw-600 flex-grow-1 border-main py-2-5 text-dark"
                  data-bs-dismiss="modal"
                >
                  No
                </button>
                <button
                  type="button"
                  class="btn btn-primary bg-primary border-0 shadow-sm rounded-8 flex-grow-1 fw-600 py-2-5 text-white"
                  data-bs-dismiss="modal"
                >
                  Yes
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
