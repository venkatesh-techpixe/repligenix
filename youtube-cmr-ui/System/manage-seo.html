<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEO Configuration</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>

    <main class="main-content">
      <div class="container-fluid">
        <!-- Page Title -->
        <div class="dashboard-header mb-4">
          <h1 class="dashboard-title">SEO Configuration</h1>
        </div>

        <!-- Warning Alert -->
        <div class="premium-alert shadow-sm">
          <p>
            The SEO setting is optional for this page. If you don't configure
            SEO here, the global SEO contents will work for this page, which you
            can configure from System Setting > SEO Configuration.
          </p>
        </div>

        <div class="row g-4">
          <!-- LEFT: SEO Image Upload -->
          <div
            class="upload-card p-4 rounded-16 rounded-3 shadow-sm border bg-white"
          >
            <h6 class="fw-semibold mb-3">SEO Image</h6>

            <div
              class="border rounded-3 d-flex flex-column align-items-center justify-content-center text-center p-4 position-relative"
              style="min-height: 220px; cursor: pointer"
              onclick="document.getElementById('seoFileInput').click()"
            >
              <img
                id="seoPreview"
                src=""
                class="img-fluid rounded"
                style="max-height: 160px; display: none"
              />

              <div id="seoPlaceholder" class="text-muted">
                <svg
                  width="36"
                  height="36"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p class="mt-2 mb-0 small">Click to upload SEO image</p>
              </div>

              <input
                type="file"
                id="seoFileInput"
                accept="image/*"
                class="d-none"
                onchange="handleSeoImage(event)"
              />
            </div>

            <small class="text-muted mt-2 d-block">
              Supported: PNG, JPG, JPEG (1180×600px)
            </small>
          </div>

          <!-- RIGHT: SEO Form -->
          <div class="p-0">
            <form>
              <div
                class="dash-card-section bg-white rounded-16 border-main shadow-sm"
              >
                <div class="row g-4">
                  <!-- Meta Keywords -->
                  <div class="col-12">
                    <label class="form-label mb-2">
                      Meta Keywords <span class="text-danger">*</span>
                      <span
                        class="fw-400 fs-0-85 ms-2"
                        style="color: var(--text-light)"
                      >
                        Separate multiple keywords by <kbd>,</kbd> (comma) or
                        <kbd>enter</kbd> key
                      </span>
                    </label>
                    <div
                      class="form-control premium-input d-flex flex-wrap gap-2 h-auto py-2"
                      id="keywordsBox"
                      style="min-height: 48px; cursor: text"
                      onclick="
                        document.getElementById('keywordHiddenInput').focus()
                      "
                    >
                      <input
                        id="keywordHiddenInput"
                        style="outline: none"
                        class="border-0 bg-transparent"
                        type="text"
                        placeholder="Add keyword..."
                        onkeydown="addKeyword(event)"
                      />
                    </div>
                  </div>

                  <!-- Meta Robots -->
                  <div class="col-xl-6">
                    <label class="form-label mb-2">
                      Meta Robots
                      <span
                        class="fw-400 fs-0-85"
                        style="color: var(--text-light)"
                        >(optional)</span
                      >
                    </label>
                    <input
                      type="text"
                      class="form-control premium-input w-100"
                      placeholder="e.g. index, follow"
                      name="meta_robots"
                    />
                  </div>

                  <!-- Spacer for alignment -->
                  <div class="col-xl-6 d-none d-xl-block"></div>

                  <!-- Meta Description -->
                  <div class="col-12">
                    <label class="form-label mb-2">
                      Meta Description <span class="text-danger">*</span>
                    </label>
                    <textarea
                      class="form-control premium-input w-100 resize-none"
                      rows="4"
                      name="meta_description"
                      placeholder="Write a concise meta description..."
                    ></textarea>
                  </div>

                  <!-- Social Title -->
                  <div class="col-12">
                    <label class="form-label mb-2">
                      Social Title <span class="text-danger">*</span>
                    </label>
                    <input
                      type="text"
                      class="form-control premium-input w-100"
                      name="social_title"
                      placeholder="Enter social share title"
                    />
                  </div>

                  <!-- Social Description -->
                  <div class="col-12">
                    <label class="form-label mb-2">
                      Social Description <span class="text-danger">*</span>
                    </label>
                    <textarea
                      class="form-control premium-input w-100 resize-none"
                      rows="3"
                      name="social_description"
                      placeholder="Write a social share description..."
                    ></textarea>
                  </div>

                  <!-- Submit Button -->
                  <div class="col-12 mt-2">
                    <button
                      type="submit"
                      class="btn btn-confirm-yes w-100 py-3 rounded-12 fs-5 fw-bold shadow-sm transition-all hover-translate-y-n2"
                    >
                      Submit
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
        <!-- end row -->
      </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>

    <script>
      function handleSeoImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const preview = document.getElementById("seoPreview");
        const placeholder = document.getElementById("seoPlaceholder");
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        placeholder.style.display = "none";
      }

      function addKeyword(e) {
        if (e.key !== "Enter" && e.key !== ",") return;
        e.preventDefault();
        const input = e.target;
        const val = input.value.trim().replace(/,$/, "");
        if (!val) return;
        const box = document.getElementById("keywordsBox");
        const tag = document.createElement("span");
        tag.className =
          "badge-custom-primary rounded-8 px-2 py-1 fw-600 fs-0-8 d-inline-flex align-items-center gap-1";
        tag.innerHTML = `${val} <span  onclick="this.parentElement.remove()">×</span>`;
        box.insertBefore(tag, input);
        input.value = "";
      }
    </script>
  </body>
</html>
