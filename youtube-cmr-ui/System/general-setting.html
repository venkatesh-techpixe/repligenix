<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
      <!-- Sidebar -->
   <aside class="sidebar" id="sidebar">   
   </aside>

  <!-- Header -->
  <header class="top-header" id="top-header">
  </header>

    <main class="main-content">
      <div class="container-fluid">
        <!-- Page Title -->
        <div class="dashboard-header mb-4">
          <h1 class="dashboard-title">General Setting</h1>
        </div>

        <!-- Settings Card -->
        <div class="bg-white rounded-16 p-4 p-lg-5 shadow-sm border-main">
          <form>
            <div class="row g-4">
              <!-- Site Title -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Site Title <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input w-100"
                    value="Repligenix"
                    placeholder="Enter Site Title"
                  />
                </div>
              </div>

              <!-- Currency -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Currency <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input w-100"
                    value="INR"
                    placeholder="Enter Currency"
                  />
                </div>
              </div>

              <!-- Currency Symbol -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Currency Symbol <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input w-100"
                    value="₹"
                    placeholder="Enter Symbol"
                  />
                </div>
              </div>

              <!-- Timezone -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Timezone <span class="text-danger">*</span></label
                  >
                  <select class="form-select premium-input">
                    <option selected>Asia/Kolkata</option>
                    <option value="1">UTC</option>
                    <option value="2">America/New_York</option>
                    <option value="3">Europe/London</option>
                    <option value="4">Australia/Sydney</option>
                  </select>
                </div>
              </div>

              <!-- Site Base Color -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Site Base Color <span class="text-danger">*</span></label
                  >
                  <div class="input-group">
                    <div
                      class="input-group-text p-0 border-main bg-white overflow-hidden"
                      style="
                        width: 70px;
                        border-radius: 10px 0 0 10px;
                        height: 48px;
                      "
                    >
                      <input
                        type="color"
                        class="form-control form-control-color border-0 w-100 h-100"
                        value="#afce2e"
                        class="p-0"
                      />
                    </div>
                    <input
                      type="text"
                      class="form-control premium-input border-start-0"
                      value="afce2e"
                      style="
                        border-top-left-radius: 0;
                        border-bottom-left-radius: 0;
                        height: 48px;
                      "
                    />
                  </div>
                </div>
              </div>

              <!-- Site Secondary Color -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Site Secondary Color
                    <span class="text-danger">*</span></label
                  >
                  <div class="input-group">
                    <div
                      class="input-group-text p-0 border-main bg-white overflow-hidden"
                      style="
                        width: 70px;
                        border-radius: 10px 0 0 10px;
                        height: 48px;
                      "
                    >
                      <input
                        type="color"
                        class="form-control form-control-color border-0 w-100 h-100"
                        value="#3a4119"
                        class="p-0"
                      />
                    </div>
                    <input
                      type="text"
                      class="form-control premium-input border-start-0"
                      value="3a4119"
                      style="
                        border-top-left-radius: 0;
                        border-bottom-left-radius: 0;
                        height: 48px;
                      "
                    />
                  </div>
                </div>
              </div>

              <!-- Record to Display Per page -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Record to Display Per page</label
                  >
                  <select class="form-select premium-input h-auto">
                    <option selected>20 items per page</option>
                    <option value="1">50 items per page</option>
                    <option value="2">100 items per page</option>
                  </select>
                </div>
              </div>

              <!-- Currency Showing Format -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Currency Showing Format
                    <span class="text-danger">*</span></label
                  >
                  <select class="form-select premium-input">
                    <option selected value="1">Show Symbol Only</option>
                    <option value="2">Show Currency Text and Symbol</option>
                    <option value="3">Show Text Only</option>
                  </select>
                </div>
              </div>

              <!-- Free Trial -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Free Trial <span class="text-danger">*</span></label
                  >
                  <select class="form-select premium-input">
                    <option selected>Disable</option>
                    <option value="1">Enable</option>
                  </select>
                </div>
              </div>

              <!-- Trial Duration -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Trial Duration <span class="text-danger">*</span></label
                  >
                  <div class="input-group">
                    <input
                      type="number"
                      class="form-control premium-input border-end-0"
                      value="15"
                    />
                    <span
                      class="input-group-text border-main bg-light fs-0-9 fw-600 px-3"
                      >Days</span
                    >
                  </div>
                </div>
              </div>

              <!-- Channel Count -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Channel Count <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    class="form-control premium-input w-100"
                    value="10000"
                  />
                </div>
              </div>

              <!-- Comment Count -->
              <div class="col-xl-3 col-md-6">
                <div class="form-group">
                  <label class="form-label mb-2"
                    >Comment Count <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    class="form-control premium-input w-100"
                    value="1000000"
                  />
                </div>
              </div>

              <!-- Submit Button -->
              <div class="col-12 mt-4">
                <button
                  type="submit"
                  class="btn btn-confirm-yes w-100 py-3 rounded-12 fs-5 fw-bold shadow-sm transition-all hover-translate-y-n2"
                >
                  Submit
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>

  </body>
</html>
