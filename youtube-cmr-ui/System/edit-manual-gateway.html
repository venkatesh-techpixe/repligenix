<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>

    <main class="main-content">
      <div class="container-fluid">
        <!-- Page Title -->
        <div class="dashboard-header mb-4">
          <h1 class="dashboard-title">Add Manual Gateway</h1>
        </div>

        <!-- Top Section -->
        <div class="row g-4 mb-4">
          <div class="col-xl-3 col-lg-4">
            <div class="bg-white border rounded-12 p-4 text-center shadow-sm">
              <div
                id="logoUploadBox"
                class="border rounded-12 d-flex align-items-center justify-content-center mb-3 position-relative"
                style="height: 170px; cursor: pointer"
                onclick="document.getElementById('gatewayLogo').click()"
              >
                <!-- Preview Image -->
                <img
                  id="logoPreview"
                  class="img-fluid rounded-12"
                  style="min-height: 100%; min-width: 100%; display: none"
                />

                <!-- Placeholder Icon -->
                <svg
                  id="logoPlaceholder"
                  width="40"
                  height="40"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>

                <!-- Upload Button -->
                <div
                  class="position-absolute bottom-0 end-0 translate-middle bg-primary text-white rounded-circle d-flex align-items-center justify-content-center cursor-pointer shadow-sm"
                  style="width: 38px; height: 38px"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                  </svg>
                </div>

                <input
                  type="file"
                  id="gatewayLogo"
                  class="d-none"
                  accept="image/*"
                />
              </div>

              <small class="text-muted">
                Upload Logo <br />
                PNG / JPG
              </small>
            </div>
          </div>
          <!-- Gateway Inputs -->
          <div class="col-xl-9 col-lg-8">
            <div class="bg-white border rounded-12 p-4 shadow-sm">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label fw-600">Gateway Name</label>
                  <input type="text" class="form-control premium-input" />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-600">Currency</label>
                  <input type="text" class="form-control premium-input" />
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-600">Rate</label>
                  <div class="input-group">
                    <span class="input-group-text">1 INR =</span>
                    <input type="text" class="form-control premium-input" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Range + Charge -->
        <div class="row g-4 mb-4">
          <!-- Range -->
          <div class="col-lg-6">
            <div class="bg-white border rounded-12 p-4 shadow-sm">
              <h6 class="fw-700 mb-3">Range</h6>

              <div class="mb-3">
                <label class="form-label">Minimum Amount</label>
                <div class="input-group">
                  <input type="text" class="form-control premium-input" />
                  <span class="input-group-text">INR</span>
                </div>
              </div>

              <div>
                <label class="form-label">Maximum Amount</label>
                <div class="input-group">
                  <input type="text" class="form-control premium-input" />
                  <span class="input-group-text">INR</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Charge -->
          <div class="col-lg-6">
            <div class="bg-white border rounded-12 p-4 shadow-sm">
              <h6 class="fw-700 mb-3">Charge</h6>

              <div class="mb-3">
                <label class="form-label">Fixed Charge</label>
                <div class="input-group">
                  <input type="text" class="form-control premium-input" />
                  <span class="input-group-text">INR</span>
                </div>
              </div>

              <div>
                <label class="form-label">Percent Charge</label>
                <div class="input-group">
                  <input type="text" class="form-control premium-input" />
                  <span class="input-group-text">%</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Deposit Instruction -->
        <div class="bg-white border rounded-12 p-4 shadow-sm mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-700 mb-0">Deposit Instruction</h6>
          </div>

          <textarea
            rows="6"
            class="form-control premium-input"
            placeholder="Write instructions for the user..."
          ></textarea>
        </div>

        <!-- User Data -->
        <div class="channel-table-container p-0 overflow-hidden rounded-12 bg-white border-main mb-4">

  <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <h6 class="fw-700 mb-0">User Data</h6>

    <button
      class="btn bg-primary text-white rounded-8 px-3"
      data-bs-toggle="modal"
      data-bs-target="#generateFormModal"
      onclick="prepareForm('add')"
    >
      + Add New
    </button>
  </div>

  <div class="table-responsive">

    <table class="table premium-table mb-0">

      <thead class="table-primary-head">
        <tr>
          <th class="ps-4">Name</th>
          <th>Type</th>
          <th>Width</th>
          <th>Required</th>
          <th class="pe-4">Action</th>
        </tr>
      </thead>

      <tbody>

        <!-- Row -->
        <tr>

          <td class="ps-4">
            <div class="fw-600 text-dark">Receipt</div>
          </td>

          <td>
            <div class="text-muted">File</div>
          </td>

          <td>
            <div class="text-muted">100%</div>
          </td>

          <td>
            <span class="badge bg-success-subtle text-success border border-success">
              Required
            </span>
          </td>

          <td class="pe-4">

            <div class="d-flex gap-2">

              <button
                class="btn-action text-primary-btn"
                data-bs-toggle="modal"
                data-bs-target="#generateFormModal"
                onclick="prepareForm('edit','Receipt','File','Yes','Full Width')"
              >
                <svg width="16" height="16" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>

              <button class="btn-action text-danger-btn">
                <svg width="16" height="16" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

        <!-- Submit -->
        <div class="text-end">
          <button class="btn bg-primary text-white px-5 py-2 rounded-8 fw-600">
            Submit Gateway
          </button>
        </div>
      </div>

      <!-- Generate Form Modal -->
      <div
        class="modal fade"
        id="generateFormModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-12 border-0 shadow-lg">
            <!-- Header -->
            <div class="modal-header border-bottom border-main">
              <h5 class="fw-700 mb-0">Generate Form</h5>
              <button
                type="button"
                class="btn-close shadow-none"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <!-- Body -->
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label fw-600"
                  >Type <span class="text-danger">*</span></label
                >
                <select class="form-select premium-input">
                  <option>Select One</option>
                  <option>Text</option>
                  <option>Textarea</option>
                  <option>File</option>
                  <option>Select</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"
                  >Is Required <span class="text-danger">*</span></label
                >
                <select class="form-select premium-input">
                  <option>Select One</option>
                  <option>Yes</option>
                  <option>No</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"
                  >Label <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control premium-input"
                  placeholder="Enter label"
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"
                  >Width <span class="text-danger">*</span></label
                >
                <select class="form-select premium-input">
                  <option>Select One</option>
                  <option>Full Width</option>
                  <option>Half Width</option>
                </select>
              </div>

              <div>
                <label class="form-label fw-600">
                  Instruction <span class="text-muted">(if any)</span>
                </label>

                <textarea
                  rows="3"
                  class="form-control premium-input"
                  placeholder="Write instruction..."
                ></textarea>
              </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer border-top border-main">
              <button class="btn bg-primary p-2 text-white w-100 rounded-8 fw-600">
                Add
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const fileInput = document.getElementById("gatewayLogo");
      const preview = document.getElementById("logoPreview");
      const placeholder = document.getElementById("logoPlaceholder");

      fileInput.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = "block";
          placeholder.style.display = "none";
        };

        reader.readAsDataURL(file);
      });
    </script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
