<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>add manual gateway</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>
   

    <main class="main-content">
        <div class="container-fluid">

  <!-- Page Header -->
  <div class="dashboard-header mb-4">
    <h5 class="fw-700">Maintenance Mode</h5>
  </div>

  <div class="bg-white border-main rounded-16 shadow-sm p-4">

    <!-- Status -->
    <div class="mb-4">

      <label class="fw-600 mb-2 d-block">Status</label>

      <div class="d-flex flex-wrap align-items-center gap-3">

         <div class="toggle-switch-wrapper">
                <button class="btn btn-toggle btn-toggle-disable">
                  Disable
                </button>
              </div>

        <span class="text-muted fs-0-9">
          Enable maintenance mode to temporarily disable the website.
        </span>

      </div>

    </div>

    <!-- Content Row -->
    <div class="row g-4">

      <!-- Upload Image -->
      <div class="col-lg-5">

        <label class="fw-600 mb-2 d-block">Maintenance Image</label>

        <div
          class="border-main rounded-12 p-3 text-center position-relative bg-light-subtle">

          <img
            id="maintenancePreview"
            src="https://cdn-icons-png.flaticon.com/512/2910/2910768.png"
            class="img-fluid rounded-10 mb-2"
            style="max-height:200px;"
          />

          <input
            type="file"
            id="maintenanceImage"
            class="d-none"
            accept="image/*"
          />

          <button
            class="btn bg-primary text-white rounded-circle position-absolute"
            style="right:15px; bottom:15px; width:40px; height:40px"
            onclick="document.getElementById('maintenanceImage').click()"
          >
               <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                      ></path>
                      <polyline points="17 8 12 3 7 8"></polyline>
                      <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
          </button>

        </div>

        <small class="text-muted fs-0-8">
          Supported files: PNG, JPG, JPEG
        </small>

      </div>

      <!-- Description -->
      <div class="col-lg-7">

        <label class="fw-600 mb-2 d-block">
          Maintenance Message
        </label>

        <textarea
          class="form-control premium-input shadow-none"
          rows="9"
        >
THE SITE IS UNDER MAINTENANCE

We're just tuning up a few things. We apologize for the inconvenience but our site is currently undergoing planned maintenance.

Thanks for your patience.
        </textarea>

      </div>

    </div>

    <!-- Submit -->
    <div class="mt-4">
      <button
        class="btn bg-primary text-white w-100 py-3 rounded-12 fw-600 shadow-sm">
        Save Settings
      </button>
    </div>

  </div>

</div>
    </main>


    <script>

const imageInput = document.getElementById("maintenanceImage");
const previewImage = document.getElementById("maintenancePreview");

imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (e) {
    previewImage.src = e.target.result;
  };

  reader.readAsDataURL(file);

});
    </script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
