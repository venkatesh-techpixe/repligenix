<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
       <!-- Sidebar -->
   <aside class="sidebar" id="sidebar">   
   </aside>

  <!-- Header -->
  <header class="top-header" id="top-header">
  </header>

    <main class="main-content">
      <div
        class="dashboard-header mb-4 d-flex justify-content-between align-items-center"
      >
        <h2 class="dashboard-title">System Update</h2>
        <a
          href="#"
          class="btn bg-primary text-white d-flex align-items-center gap-2 rounded-12 shadow-sm py-2 px-3 fw-600 fs-0-85"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
            ></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          Update Log
        </a>
      </div>

      <div class="row justify-content-center mt-4">
        <div class="col-lg-10">
          <div class="vd-info-card p-2 p-md-5 text-center shadow-sm">
            <div class="py-4">
              <h1
                class="fw-800 mb-0 text-warning"
              >
                1.0
              </h1>
              <p class="fs-4 text-muted fw-600 mb-5">Your Version</p>

              <div
                class="border rounded-12 p-4 mt-3 text-start d-flex align-items-center flex-wrap gap-3"
       
              >
                <div
                  class="p-2 rounded-circle d-flex align-items-center justify-content-center bg-success text-white"
                >
                  <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <div>
                  <p
                    class="mb-0 text-muted lh-base fw-500"
                  >
                    You are currently using the latest version of the script.
                    Check your version code at your dashboard and compare with
                    your version code. If both version matches then everything
                    is okay. Check our documentation for more details.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>

  </body>
</html>
