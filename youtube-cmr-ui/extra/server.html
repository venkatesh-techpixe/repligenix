<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
        <!-- Sidebar -->
   <aside class="sidebar" id="sidebar">   
   </aside>

  <!-- Header -->
  <header class="top-header" id="top-header">
  </header>

    <main class="main-content">
      <div class="dashboard-header mb-4">
        <h2 class="dashboard-title">Server Information</h2>
      </div>

      <div class="vd-info-card">
        <div class="vd-info-item">
          <span class="vd-info-label">PHP Version</span>
          <span class="vd-info-value text-muted fw-500">8.3.22</span>
        </div>
        <div class="vd-info-item">
          <span class="vd-info-label">Server Software</span>
          <span class="vd-info-value text-muted fw-500">LiteSpeed</span>
        </div>
        <div class="vd-info-item">
          <span class="vd-info-label">Server IP Address</span>
          <span class="vd-info-value text-muted fw-500"
            >2a02:4780:11:2088:0:1faf:73a8:2</span
          >
        </div>
        <div class="vd-info-item">
          <span class="vd-info-label">Server Protocol</span>
          <span class="vd-info-value text-muted fw-500">HTTP/1.1</span>
        </div>
        <div class="vd-info-item">
          <span class="vd-info-label">HTTP Host</span>
          <span class="vd-info-value text-muted fw-500">repligenix.com</span>
        </div>
        <div class="vd-info-item">
          <span class="vd-info-label">Server Port</span>
          <span class="vd-info-value text-muted fw-500">443</span>
        </div>
      </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>

  </body>
</html>
