<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cache</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
        <!-- Sidebar -->
   <aside class="sidebar" id="sidebar">   
   </aside>

  <!-- Header -->
  <header class="top-header" id="top-header">
  </header>

    <main class="main-content">
      <div class="dashboard-header mb-4">
        <h2 class="dashboard-title">Clear System Cache</h2>
      </div>

      <div class="vd-info-card">
        <div class="vd-info-item justify-content-start gap-3">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--success)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="vd-info-value text-muted fw-500"
            >Compiled views will be cleared</span
          >
        </div>
        <div class="vd-info-item justify-content-start gap-3">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--success)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="vd-info-value text-muted fw-500"
            >Application cache will be cleared</span
          >
        </div>
        <div class="vd-info-item justify-content-start gap-3">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--success)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="vd-info-value text-muted fw-500"
            >Route cache will be cleared</span
          >
        </div>
        <div class="vd-info-item justify-content-start gap-3">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--success)"
            stroke-width="3"
            stroke-linecap
            round="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="vd-info-value text-muted fw-500"
            >Configuration cache will be cleared</span
          >
        </div>
        <div class="vd-info-item justify-content-start gap-3">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--success)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="vd-info-value text-muted fw-500"
            >Compiled services and packages files will be removed</span
          >
        </div>
        <div class="vd-info-item justify-content-start gap-3">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--success)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="vd-info-value text-muted fw-500"
            >Caches will be cleared</span
          >
        </div>
        <div class="p-4">
          <button class="btn-confirm-yes w-100 py-3 rounded-12">
            Click to clear
          </button>
        </div>
      </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
        <script src="../script/layout.js"></script>

  </body>
</html>
