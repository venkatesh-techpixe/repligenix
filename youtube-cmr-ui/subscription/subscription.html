<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
       <!-- Sidebar -->
   <aside class="sidebar" id="sidebar">   
   </aside>

  <!-- Header -->
  <header class="top-header" id="top-header">
  </header>

    <main class="main-content">
      <div
        class="dashboard-header d-flex justify-content-between align-items-center mb-4 flex-wrap"
      >
        <h2 class="dashboard-title">Subscription Plans</h2>
        <div class="d-flex gap-2 flex-wrap align-items-center">
          <!-- Search Bar -->
          <div class="input-group w-300">
            <input
              type="text"
              class="form-control form-category border-end-0 rounded-l-8 border-main"
              placeholder="Search Name"
            />
            <button
              class="btn btn-primary px-3 rounded-r-8 bg-primary border-primary"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
          <!-- Add New Button -->
          <button
            class="btn btn-primary btn-add-new"
            data-bs-toggle="modal"
            data-bs-target="#categoryModal"
            onclick="prepareModal('add')"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add New
          </button>
        </div>
      </div>

      <!-- Categories Table -->
      <div
        class="channel-table-container p-0 overflow-hidden rounded-12 bg-white border-main"
      >
        <div class="table-responsive">
          <table class="table premium-table mb-0">
            <thead class="table-primary-head">
              <tr>
                <th class="ps-4">Name</th>
                <th>Highlight</th>
                <th>Monthly Price</th>
                <th>Yearly Price</th>
                <th>Comment Count</th>
                <th>Channel Count</th>
                <th>Status</th>
                <th class="pe-4">Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- Row 1 -->
              <tr>
                <td class="ps-4">
                  <div class="fw-600 text-dark">Youtube comments</div>
                </td>
                <td>
                  <div class="text-muted">Comments</div>
                </td>
                <td>
                  <div class="text-dark fw-600">₹1.00 INR</div>
                </td>
                <td>
                  <div class="text-dark fw-600">₹1,000.00 INR</div>
                </td>
                <td>
                  <div class="text-muted">2147483647</div>
                </td>
                <td>
                  <div class="text-muted">10</div>
                </td>
                <td>
                  <span class="status-badge status-active">Enabled</span>
                </td>
                <td class="pe-4">
                  <div class="d-flex gap-2">
                    <button
                      class="btn-action text-primary-btn"
                      title="Edit"
                      data-bs-toggle="modal"
                      data-bs-target="#categoryModal"
                      onclick="
                        prepareModal(
                          'edit',
                          'Youtube comments',
                          'Comments',
                          '1.00',
                          '1000.00',
                          '2147483647',
                          '10',
                        )
                      "
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                        ></path>
                        <path
                          d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                        ></path>
                      </svg>
                    </button>
                    <button
                      class="btn-action text-danger-btn"
                      title="Disable"
                      data-bs-toggle="modal"
                      data-bs-target="#confirmationModal"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modals -->
    <!-- Add/Update Category Modal -->
    <div
      class="modal fade"
      id="categoryModal"
      tabindex="-1"
      aria-labelledby="categoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-20">
          <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
            <h5 class="modal-title fw-700 text-dark" id="categoryModalLabel">
              Add New Subscription Plan
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body px-4 py-4">
            <form id="subscriptionForm">
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="planName" class="form-label mb-2"
                    >Plan Name <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input shadow-none"
                    id="planName"
                    placeholder="Enter plan name"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="planHighlight" class="form-label mb-2"
                    >Highlight <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input shadow-none"
                    id="planHighlight"
                    placeholder="Enter highlight"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="monthlyPrice" class="form-label mb-2"
                    >Monthly Price <span class="text-danger">*</span></label
                  >
                  <div class="input-group">
                    <input
                      type="number"
                      step="0.01"
                      class="form-control premium-input shadow-none border-end-0"
                      id="monthlyPrice"
                      placeholder="0.00"
                      required
                    />
                    <span
                      class="input-group-text bg-light border-start-0 text-muted"
                      >INR</span
                    >
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="yearlyPrice" class="form-label mb-2"
                    >Yearly Price <span class="text-danger">*</span></label
                  >
                  <div class="input-group">
                    <input
                      type="number"
                      step="0.01"
                      class="form-control premium-input shadow-none border-end-0"
                      id="yearlyPrice"
                      placeholder="0.00"
                      required
                    />
                    <span
                      class="input-group-text bg-light border-start-0 text-muted"
                      >INR</span
                    >
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="commentCount" class="form-label mb-2"
                    >Comment Count <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    class="form-control premium-input shadow-none"
                    id="commentCount"
                    placeholder="Enter comment count"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="channelCount" class="form-label mb-2"
                    >Channel Count <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    class="form-control premium-input shadow-none"
                    id="channelCount"
                    placeholder="Enter channel count"
                    required
                  />
                </div>
                <div class="col-12">
                  <label class="form-label mb-2">Add Your Plan List</label>
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control premium-input shadow-none"
                      placeholder="Enter service item"
                    />
                    <button
                      class="btn btn-outline-primary px-4 bg-white"
                      type="button"
                    >
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
              <button
                type="submit"
                class="btn btn-primary w-100 py-3 rounded-12 fw-600 shadow-sm border-0 bg-primary"
              >
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div
      class="modal fade"
      id="confirmationModal"
      tabindex="-1"
      aria-labelledby="confirmationModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered max-w-400">
        <div class="modal-content rounded-20">
          <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
            <h5
              class="modal-title fw-700 text-dark"
              id="confirmationModalLabel"
            >
              Confirmation Alert!
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body px-4 py-3">
            <p class="text-muted mb-4 fs-0-9 fw-500">
              Are you sure to disable this plan?
            </p>
            <div class="d-flex gap-3 mb-2">
              <button
                type="button"
                class="btn-confirm-no flex-grow-1"
                data-bs-dismiss="modal"
              >
                No
              </button>
              <button
                type="button"
                class="btn-confirm-yes flex-grow-1"
                id="confirmDisableBtn"
              >
                Yes
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Modal Logic Script -->
    <script>
      function prepareModal(
        action,
        name = "",
        highlight = "",
        monthly = "",
        yearly = "",
        comments = "",
        channels = "",
      ) {
        const title = document.getElementById("categoryModalLabel");

        const nameInput = document.getElementById("planName");
        const highlightInput = document.getElementById("planHighlight");
        const monthlyInput = document.getElementById("monthlyPrice");
        const yearlyInput = document.getElementById("yearlyPrice");
        const commentInput = document.getElementById("commentCount");
        const channelInput = document.getElementById("channelCount");

        if (action === "edit") {
          title.textContent = "Upgrade Subscription Plan";
          nameInput.value = name;
          highlightInput.value = highlight;
          monthlyInput.value = monthly;
          yearlyInput.value = yearly;
          commentInput.value = comments;
          channelInput.value = channels;
        } else {
          title.textContent = "Add New Subscription Plan";
          nameInput.value = "";
          highlightInput.value = "";
          monthlyInput.value = "";
          yearlyInput.value = "";
          commentInput.value = "";
          channelInput.value = "";
        }
      }
    </script>

    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
