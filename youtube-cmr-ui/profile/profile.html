<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>add manual gateway</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>
   

<main class="main-content">
  <div class="p-4">

    <!-- Page Header -->
    <div class="dashboard-header mb-4">
      <h2 class="dashboard-title">Profile</h2>
      <a href="./password.html" class="btn-add-new">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
        Password Setting
      </a>
    </div>

    <div class="row g-4">

      <!-- Top Full-Width Identity Card -->
      <div class="col-12">
        <div class="dash-card-section p-0 overflow-hidden">

          <!-- Banner -->
          <div class="bg-primary d-flex align-items-center gap-3 p-4">
            <div class="flex-grow-1">
              <h3 class="fw-800 mb-1 text-white fs-5">Super Admins</h3>
              <span class="fs-0-85 fw-500 text-light">@Bstore &nbsp;·&nbsp; bstore.ecom@gmail.com</span>
            </div>
          </div>

          <!-- Info Strip -->
          <div class="d-flex align-items-center flex-wrap gap-4 px-4 py-3 border-top bg-white">
            <div class="d-flex align-items-center gap-2">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span class="fs-0-85 text-muted">Name:</span>
              <span class="fs-0-85 fw-700">Super Admins</span>
            </div>
            <div class="vr"></div>
            <div class="d-flex align-items-center gap-2">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <span class="fs-0-85 text-muted">Email:</span>
              <span class="fs-0-85 fw-700">bstore.ecom@gmail.com</span>
            </div>
            <div class="vr"></div>
            <div class="d-flex align-items-center gap-2">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span class="fs-0-85 text-muted">Joined:</span>
              <span class="fs-0-85 fw-700">March 2024</span>
            </div>
          </div>

        </div>
      </div>

      <!-- Left: Image Upload -->
      <div class="col-lg-4">
        <div class="upload-card h-100">
          <h6 class="upload-title">Profile Photo</h6>

          <div class="image-upload-area rounded-16 mb-3 cursor-pointer" id="profileUploadArea">
            <img src="https://placehold.co/300x300/eef2ff/1f2f97?text=SA" alt="Profile" class="preview-image rounded-16" id="profilePreview">
            <label for="profileImageInput" class="upload-trigger cursor-pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <polyline points="16 16 12 12 8 16"/>
                <line x1="12" y1="12" x2="12" y2="21"/>
                <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
              </svg>
            </label>
            <input type="file" id="profileImageInput" accept=".png,.jpg,.jpeg" class="d-none">
          </div>

          <p class="file-extension-info mb-0">
            Supported: <strong>.png, .jpg, .jpeg</strong><br>
            Resized to <strong>400×400px</strong>
          </p>
        </div>
      </div>

      <!-- Right: Form -->
      <div class="col-lg-8">
        <div class="upload-card h-100">
          <h6 class="upload-title">Edit Information</h6>

          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control premium-input" value="Super Admins" placeholder="Enter your name">
            </div>
            <div class="col-12">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control premium-input" value="bstore.ecom@gmail.com" placeholder="Enter your email">
            </div>
          </div>

          <hr class="my-4 border-main">

          <div class="d-flex justify-content-end">
            <button class="btn-add-new px-5">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Save Changes
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    const input = document.getElementById('profileImageInput');
    const preview = document.getElementById('profilePreview');
    input.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => preview.src = e.target.result;
        reader.readAsDataURL(file);
      }
    });
  </script>
</main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
