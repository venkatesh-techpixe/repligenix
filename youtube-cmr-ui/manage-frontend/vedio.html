<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Videos</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>

    <main class="main-content">
      <div class="container-fluid">
        <!-- PAGE TITLE -->
        <div
          class="dashboard-header d-flex justify-content-between align-items-center mb-4"
        >
          <h2 class="dashboard-title">Videos</h2>

        </div>

        <!-- ABOUT FORM CARD -->
        <div class="bg-white border-main rounded-12 shadow-sm p-4 mb-4">
          <div class="row g-4 ">
            <!-- IMAGE -->
            <div class="col-lg-4">
              <label class="form-label mb-2 fw-600"> image </label>

              <div
                class="position-relative border-main rounded-12 overflow-hidden"
              >
                <img
                  src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d"
                  class="img-fluid w-100"
                  style="height: 260px; object-fit: cover"
                />

                <button
                  class="btn bg-primary text-white rounded-circle position-absolute"
                  style="bottom: 10px; right: 10px; width: 38px; height: 38px"
                >
                  ↑
                </button>
              </div>

              <small class="text-muted">
                Supported Files: .png, .jpg, .jpeg. Image will be resized into
                575x525px
              </small>
            </div>

            <!-- FORM -->
            <div class="col-lg-8">
              <div class="mb-3 mt-5">
                <label class="form-label fw-600"> Video url <span class="text-danger">*</span> </label>

                <input
                  type="text"
                  class="form-control premium-input"
                  value="https://www.youtube.com/watch?v=WOb4cj7izpE"
                />
              </div>

            </div>
          </div>

          <!-- SUBMIT -->
          <div class="mt-4">
            <button class="btn bg-primary text-white w-100 py-3 rounded-12 fw-600">
              Submit
            </button>
          </div>
        </div>

      </div>

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Layout Scripts -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
