<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tutorial Section</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>

    <main class="main-content">
      <div class="container-fluid">
        <!-- PAGE TITLE -->
        <div
          class="dashboard-header d-flex justify-content-between align-items-center mb-4"
        >
          <h2 class="dashboard-title">Tutorial section</h2>

          <div class="d-flex gap-2">
            <button
              class="btn btn-primary btn-add-new"
              data-bs-toggle="modal"
              data-bs-target="#aboutModal"
              onclick="prepareModal('add')"
            >
              + Add New
            </button>
          </div>
        </div>

        <!-- ABOUT FORM CARD -->
        <div class="bg-white border-main rounded-12 shadow-sm p-4 mb-4">
          <div class="row g-4">
            <!-- FORM -->
            <div class="">
              <div class="mb-3">
                <label class="form-label fw-600">
                  Heading <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  class="form-control premium-input"
                  value="Manage YouTube Comments in 3 Steps"
                />
              </div>
            </div>
          </div>

          <!-- SUBMIT -->
          <div class="mt-4">
            <button
              class="btn bg-primary text-white w-100 py-3 rounded-12 fw-600"
            >
              Submit
            </button>
          </div>
        </div>

        <!-- TABLE SECTION -->

        <div class="dashboard-header d-flex justify-content-end mb-3">
          <div class="input-group w-300">
            <input
              type="text"
              class="form-control form-category border-end-0 rounded-l-8 border-main"
              placeholder="Search..."
            />

            <button
              class="btn btn-primary px-3 rounded-r-8 bg-primary border-primary"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
        </div>

        <div
          class="channel-table-container p-0 overflow-hidden rounded-12 bg-white border-main shadow-sm"
        >
          <div class="table-responsive">
            <table class="table premium-table mb-0">
              <thead class="table-primary-head">
                <tr>
                  <th class="ps-4 py-3 fw-600">Sl</th>
                  <th class="py-3 fw-600 text-center">title</th>
                  <th class="pe-4 py-3 fw-600 text-center">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="ps-4 py-3">
                    <div class="fw-700 text-dark fs-0-9">1</div>
                  </td>

                  <td class="py-3 text-center">
                    <span
                      class="px-3 py-1 fw-600 fs-0-9 text-muted rounded-pill"
                      >Amina K</span
                    >
                  </td>
                  <td class="pe-4 py-3 d-flex justify-content-center">
                    <div class="d-flex gap-2">
                      <!-- Edit -->
                      <button
                        data-bs-toggle="modal"
                        data-bs-target="#aboutModal"
                        onclick="prepareModal('edit')"
                        class="btn btn-sm border border-primary text-primary d-inline-flex align-items-center gap-1 bg-transparent hover-bg-light rounded-8 fw-600 px-3"
                      >
                        <svg
                          width="14"
                          height="14"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.5"
                        >
                          <path
                            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                          ></path>
                          <path
                            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                          ></path>
                        </svg>
                        Edit
                      </button>

                      <!-- Delete -->
                      <button
                        class="btn btn-sm border border-danger text-danger d-inline-flex align-items-center gap-1 bg-transparent hover-bg-light rounded-8 fw-600 px-3"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmationModal"
                      >
                        <svg
                          width="14"
                          height="14"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.5"
                        >
                          <polyline points="3 6 5 6 21 6"></polyline>
                          <path d="M19 6l-1 14H6L5 6"></path>
                          <path d="M10 11v6"></path>
                          <path d="M14 11v6"></path>
                          <path d="M9 6V4h6v2"></path>
                        </svg>
                        Remove
                      </button>
                    </div>
                  </td>
                </tr>

                <tr>
                  <td class="ps-4 py-3">
                    <div class="fw-700 text-dark fs-0-9">2</div>
                  </td>

            
                  <td class="py-3 text-center">
                    <span
                      class="px-3 py-1 fw-600 fs-0-9 text-muted rounded-pill"
                      >Kevin R</span
                    >
        

                  <td class="pe-4 py-3 d-flex justify-content-center">
                    <div class="d-flex gap-2">
                      <!-- Edit -->
                      <button
                        data-bs-toggle="modal"
                        data-bs-target="#aboutModal"
                        onclick="prepareModal('edit')"
                        class="btn btn-sm border border-primary text-primary d-inline-flex align-items-center gap-1 bg-transparent hover-bg-light rounded-8 fw-600 px-3"
                      >
                        <svg
                          width="14"
                          height="14"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.5"
                        >
                          <path
                            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                          ></path>
                          <path
                            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                          ></path>
                        </svg>
                        Edit
                      </button>

                      <!-- Delete -->
                      <button
                        class="btn btn-sm border border-danger text-danger d-inline-flex align-items-center gap-1 bg-transparent hover-bg-light rounded-8 fw-600 px-3"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmationModal"
                      >
                        <svg
                          width="14"
                          height="14"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.5"
                        >
                          <polyline points="3 6 5 6 21 6"></polyline>
                          <path d="M19 6l-1 14H6L5 6"></path>
                          <path d="M10 11v6"></path>
                          <path d="M14 11v6"></path>
                          <path d="M9 6V4h6v2"></path>
                        </svg>
                        Remove
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modals -->
      <!-- Add/Update Category Modal -->
      <div
        class="modal fade"
        id="aboutModal"
        tabindex="-1"
        aria-labelledby="aboutModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-20">
            <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
              <h5 class="modal-title fw-700 text-dark" id="aboutModalLabel">
                Add New Tutorial Item
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body px-4 py-4">
              <form id="categoryForm">
                <div class="mb-4">
                  <label for="categoryName" class="form-label mb-2"
                    >Title <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input shadow-none"
                    id="authorName"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-3 rounded-12 fw-600 shadow-sm border-0 bg-primary"
                >
                  Submit
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Confirmation Modal -->
      <div
        class="modal fade"
        id="confirmationModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-12 border-0 shadow-lg bg-white">
            <div
              class="modal-header border-bottom px-4 py-3 bg-white rounded-top-12 d-flex justify-content-between align-items-center"
            >
              <h5 class="modal-title fw-800 text-danger m-0 fs-5">
                Confirmation Alert!
              </h5>
              <button
                type="button"
                class="btn-close shadow-none"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body px-4 py-4">
              <p
                class="text-muted mb-4 text-center px-4"
                id="confirmationModalBody"
              >
                Are you sure to remove this item?
              </p>
              <div class="d-flex gap-3 mt-4">
                <button
                  type="button"
                  class="btn btn-light bg-light rounded-8 fw-600 flex-grow-1 border-main py-2-5 text-dark"
                  data-bs-dismiss="modal"
                >
                  No
                </button>
                <button
                  type="button"
                  class="btn btn-primary bg-primary border-0 shadow-sm rounded-8 flex-grow-1 fw-600 py-2-5 text-white"
                  data-bs-dismiss="modal"
                >
                  Yes
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Layout Scripts -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
