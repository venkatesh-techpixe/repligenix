<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Subscribe</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>

    <main class="main-content">
      <div class="container-fluid">
        <!-- PAGE TITLE -->
        <div
          class="dashboard-header d-flex justify-content-between align-items-center mb-4"
        >
          <h2 class="dashboard-title">Subscribe Section</h2>
        </div>

        <!-- ABOUT FORM CARD -->
        <div class="bg-white border-main rounded-12 shadow-sm p-4 mb-4">
          <div class="row g-4">

            <!-- FORM -->
            <div class="col-lg-12">
              <div class="mb-3">
                <label class="form-label fw-600"> Heading <span class="text-danger">*</span> </label>

                <input
                  type="text"
                  class="form-control premium-input"
                  value="Sign up for Harness Updates"
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-600"> Subheading <span class="text-danger">*</span> </label>

                <input
                  type="text"
                  class="form-control premium-input"
                  value="Subscribe to our newsletter to receive the latest Harness updates in your inboxstraight to your inbox."
                />
              </div>
            </div>
          </div>

          <!-- SUBMIT -->
          <div class="mt-4">
            <button class="btn bg-primary text-white w-100 py-3 rounded-12 fw-600">
              Submit
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Layout Scripts -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
