<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
      <!-- Sidebar -->
   <aside class="sidebar" id="sidebar">   
   </aside>

  <!-- Header -->
  <header class="top-header" id="top-header">
  </header>

    <main class="main-content">
      <div
        class="dashboard-header d-flex justify-content-between align-items-center mb-4"
      >
        <h2 class="dashboard-title">User Detail - saiteja</h2>
        <a
          href="#"
          class="btn bg-primary text-white d-flex align-items-center gap-2 rounded-12 shadow-sm py-2 px-3 fw-600 fs-0-85"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Login as User
        </a>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div
            class="vd-stat-card border-0 shadow-sm flex-row align-items-center justify-content-between text-white p-4 bg-gradient-success"
          >
            <div>
              <div class="fs-0-85 fw-600 mb-1 opacity-75">Total Payments</div>
              <div class="fs-4 fw-800">₹1,002.00 INR</div>
            </div>
            <div class="rounded-12 p-3">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
              </svg>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div
            class="vd-stat-card border-0 shadow-sm flex-row align-items-center justify-content-between text-white p-4 bg-gradient-primary"
          >
            <div>
              <div class="fs-0-85 fw-600 mb-1 opacity-75">Current Plan</div>
              <div class="fs-4 fw-800">Youtube comments</div>
            </div>
            <div class="rounded-12 p-3">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
              </svg>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div
            class="vd-stat-card border-0 shadow-sm flex-row align-items-center justify-content-between text-white p-4 bg-gradient-info"
          >
            <div>
              <div class="fs-0-85 fw-600 mb-1 opacity-75">Expired Date</div>
              <div class="fs-4 fw-800">January 05, 2027</div>
            </div>
            <div class="rounded-12 p-3">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <button
            class="btn bg-primary text-white w-100 py-3 rounded-12 fw-700 shadow-sm d-flex align-items-center justify-content-center gap-2"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <polyline points="23 21 23 11 19 11 23 21"></polyline>
            </svg>
            Logins
          </button>
        </div>
        <div class="col-md-4">
          <button
            class="btn bg-secondary text-white w-100 py-3 rounded-12 fw-700 shadow-sm d-flex align-items-center justify-content-center gap-2"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            Notifications
          </button>
        </div>
        <div class="col-md-4">
          <button
            data-bs-toggle="modal"
            data-bs-target="#categoryModal"
            class="btn bg-warning text-white w-100 py-3 rounded-12 fw-700 shadow-sm border-0 d-flex align-items-center justify-content-center gap-2"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            Ban User
          </button>
        </div>
      </div>

      <div class="vd-info-card p-0 mb-5">
        <div class="p-4 border-bottom">
          <h5 class="mb-0 fw-800 opacity-75">Information of sai teja</h5>
        </div>
        <div class="p-4">
          <form>
            <div class="row g-4">
              <div class="col-md-6 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >First Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control rounded-12 p-3 bg-light border-0"
                  value="sai"
                />
              </div>
              <div class="col-md-6 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >Last Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control rounded-12 p-3 bg-light border-0"
                  value="teja"
                />
              </div>
              <div class="col-md-6 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >Email <span class="text-danger">*</span></label
                >
                <input
                  type="email"
                  class="form-control rounded-12 p-3 bg-light border-0"
                  value="bharatshop.rajasthan@gmail.com"
                />
              </div>
              <div class="col-md-6 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >Mobile Number <span class="text-danger">*</span></label
                >
                <div class="input-group">
                  <span
                    class="input-group-text bg-light border-0 rounded-l-12 px-3 fw-600 text-muted"
                    >+91</span
                  >
                  <input
                    type="text"
                    class="form-control rounded-r-12 p-3 bg-light border-0"
                    value="918686180840"
                  />
                </div>
              </div>
              <div class="col-12 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >Address</label
                >
                <input
                  type="text"
                  class="form-control rounded-12 p-3 bg-light border-0"
                  value="hyderabad"
                />
              </div>
              <div class="col-md-3 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted">City</label>
                <input
                  type="text"
                  class="form-control rounded-12 p-3 bg-light border-0"
                  value="hyderabad"
                />
              </div>
              <div class="col-md-3 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >State</label
                >
                <input
                  type="text"
                  class="form-control rounded-12 p-3 bg-light border-0"
                  value="telangana"
                />
              </div>
              <div class="col-md-3 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >Zip/Postal</label
                >
                <input
                  type="text"
                  class="form-control rounded-12 p-3 bg-light border-0"
                  value="500038"
                />
              </div>
              <div class="col-md-3 text-start">
                <label class="vd-info-label mb-2 fw-700 text-muted"
                  >Country <span class="text-danger">*</span></label
                >
                <select
                  class="form-select rounded-12 p-3 bg-light border-0 text-muted"
                >
                  <option selected>India</option>
                  <option>United States</option>
                  <option>United Kingdom</option>
                </select>
              </div>

              <div class="col-md-6 text-start">
                <label class="vd-info-label mb-3 fw-700 text-muted"
                  >Email Verification</label
                >
                <div
                  class="bg-success bg-opacity-10 text-success rounded-12 p-3 text-center fw-800 border border-success border-opacity-25"
                >
                  Verified
                </div>
              </div>
              <div class="col-md-6 text-start">
                <label class="vd-info-label mb-3 fw-700 text-muted"
                  >Mobile Verification</label
                >
                <div
                  class="bg-success bg-opacity-10 text-success rounded-12 p-3 text-center fw-800 border border-success border-opacity-25"
                >
                  Verified
                </div>
              </div>

              <div class="col-12 mt-5">
                <button
                  type="submit"
                  class="btn bg-primary text-white w-100 py-3 rounded-12 fw-800 shadow-sm"
                >
                  Submit
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>


          <!-- Modals -->
    <!-- Add/Update Category Modal -->
    <div
      class="modal fade"
      id="categoryModal"
      tabindex="-1"
      aria-labelledby="categoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-20">
          <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
            <h5 class="modal-title fw-700 text-dark" id="categoryModalLabel">
              Ban User
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body px-4 py-4">
            <form id="categoryForm">
              <p>If you ban this user he/she won't able to access his/her dashboard.
              </p>
              <div class="mb-4">
                <label for="categoryDescription" class="form-label mb-2"
                  >Reason <span class="text-danger">*</span></label
                >
                <textarea
                  class="form-control premium-input shadow-none"
                  id="categoryDescription"
                  rows="5"
                  required
                ></textarea>
              </div>
              <button
                type="submit"
                class="btn btn-primary w-100 py-3 rounded-12 fw-600 shadow-sm border-0 bg-primary"
              >
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../script/script.js"></script>
    <script src="../script/layout.js"></script>
  </body>
</html>
