<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/youtube-cmr-ui/css/style.css" />
    <link rel="stylesheet" href="/youtube-cmr-admin/css/admin.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Header -->
    <header class="top-header" id="top-header"></header>

    <main class="main-content">
      <!-- Header -->
      <div
        class="dashboard-header d-flex justify-content-between align-items-center"
      >
        <h2 class="dashboard-title">Manage Tones</h2>

        <button
          class="btn btn-add-new"
          class="btn btn-primary btn-add-new"
          data-bs-toggle="modal"
          data-bs-target="#categoryModal"
        >
          + add new
        </button>
      </div>

      <!-- Table -->
      <div class="channel-table-container p-0 overflow-hidden rounded-12">
        <div class="table-responsive">
          <table class="table premium-table mb-0">
            <thead class="table-primary-head">
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Status</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>Friendly</td>
                <td>Friendly</td>
                <td>
                  <span class="badge-custom-success">Activated</span>
                </td>
                <td class="text-center">
                  <!-- Edit -->
                  <button
                    data-bs-toggle="modal"
                    data-bs-target="#categoryModal"
                    onclick="prepareModal('edit')"
                    class="btn btn-sm border border-primary text-primary d-inline-flex align-items-center gap-1 bg-transparent hover-bg-light rounded-8 fw-600 px-3"
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                    >
                      <path
                        d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                      ></path>
                      <path
                        d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                      ></path>
                    </svg>
                    Edit
                  </button>

                  <!-- Delete -->
                  <button
                    class="btn btn-sm border border-danger text-danger d-inline-flex align-items-center gap-1 bg-transparent hover-bg-light rounded-8 fw-600 px-3"
                    data-bs-toggle="modal"
                    data-bs-target="#confirmationModal"
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                    >
                      <polyline points="3 6 5 6 21 6"></polyline>
                      <path d="M19 6l-1 14H6L5 6"></path>
                      <path d="M10 11v6"></path>
                      <path d="M14 11v6"></path>
                      <path d="M9 6V4h6v2"></path>
                    </svg>
                    Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Modals -->
      <!-- Add/Update Category Modal -->
      <div
        class="modal fade"
        id="categoryModal"
        tabindex="-1"
        aria-labelledby="categoryModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-20">
            <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
              <h5 class="modal-title fw-700 text-dark" id="categoryModalLabel">
                Add New Tone
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body px-4 py-4">
              <form id="categoryForm">
                <div class="mb-4">
                  <label for="categoryName" class="form-label mb-2"
                    >Name <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input shadow-none"
                    id="categoryName"
                    placeholder="Enter name"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label for="categoryDescription" class="form-label mb-2"
                    >Description <span class="text-danger">*</span></label
                  >
                  <textarea
                    class="form-control premium-input shadow-none"
                    id="categoryDescription"
                    rows="5"
                    placeholder="Enter description"
                    required
                  ></textarea>
                </div>

                <div class="mb-4 d-flex gap-2 align-items-center">
                  <label class="form-label mb-0"> Status </label>

                  <div class="form-check form-switch m-0">
                    <input
                      class="form-check-input custom-switch"
                      type="checkbox"
                      id="toneStatus"
                      checked
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-3 rounded-12 fw-600 shadow-sm border-0 bg-primary"
                >
                  Submit
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Confirmation Modal -->
      <div
        class="modal fade"
        id="confirmationModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-12 border-0 shadow-lg bg-white">
            <div
              class="modal-header border-bottom px-4 py-3 bg-white rounded-top-12 d-flex justify-content-between align-items-center"
            >
              <h5 class="modal-title fw-800 text-danger m-0 fs-5">
                Confirmation Alert!
              </h5>
              <button
                type="button"
                class="btn-close shadow-none"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body px-4 py-4">
              <p
                class="text-muted mb-4 text-center px-4"
                id="confirmationModalBody"
              >
                Are you sure to delete this tone?
              </p>
              <div class="d-flex gap-3 mt-4">
                <button
                  type="button"
                  class="btn btn-light bg-light rounded-8 fw-600 flex-grow-1 border-main py-2-5 text-dark"
                  data-bs-dismiss="modal"
                >
                  No
                </button>
                <button
                  type="button"
                  class="btn btn-primary bg-primary border-0 shadow-sm rounded-8 flex-grow-1 fw-600 py-2-5 text-white"
                  data-bs-dismiss="modal"
                >
                  Yes
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/youtube-cmr-ui/script/script.js"></script>
    <script src="/youtube-cmr-admin/script/layout.js"></script>
  </body>
</html>
