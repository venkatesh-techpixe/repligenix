<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/youtube-cmr-ui/css/style.css" />
    <link rel="stylesheet" href="/youtube-cmr-admin/css/admin.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

    </aside>

    <!-- Header -->
    <header class="top-header" id="top-header">

    </header>

  <main class="main-content">
  <div class="container-fluid">

    <!-- Header -->
    <div class="dashboard-header d-flex justify-content-between align-items-center mb-4">
      
      <h2 class="dashboard-title">FAQ List</h2>

      <div class="d-flex gap-2">

        <button
          class="btn btn-add-new"
          data-bs-toggle="modal"
          data-bs-target="#categoryModal"
        >
          + Add New
        </button>
      </div>

    </div>

    <!-- Table -->
      <div id="videos-table-container">
        <div class="table-responsive">
          <table class="table align-middle" id="videos-display-table">

          <!-- Head -->
          <thead class="table-primary-head">
            <tr>
              <th>Question</th>
              <th>Answer</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>

          <!-- Body -->
          <tbody>

            <tr>
              <td colspan="3" class="text-center py-5 fw-500">
                Data not found
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

      <!-- Modals -->
    <!-- Add/Update Category Modal -->
    <div
      class="modal fade"
      id="categoryModal"
      tabindex="-1"
      aria-labelledby="categoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-20">
          <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
            <h5 class="modal-title fw-700 text-dark" id="categoryModalLabel">
Add New FAQ
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body px-4 py-4">
            <form id="categoryForm">
              <div class="mb-4">
                <label for="categoryName" class="form-label mb-2"
                  >Question <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control premium-input shadow-none"
                  id="categoryName"
                  required
                />
              </div>
              <div class="mb-4">
                <label for="categoryDescription" class="form-label mb-2"
                  >Answer <span class="text-danger">*</span></label
                >
                <textarea
                  class="form-control premium-input shadow-none"
                  id="categoryDescription"
                  rows="5"
                  required
                ></textarea>
              </div>
              <button
                type="submit"
                class="btn btn-primary w-100 py-3 rounded-12 fw-600 shadow-sm border-0 bg-primary"
              >
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
</main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/youtube-cmr-ui/script/script.js"></script>
    <script src="/youtube-cmr-admin/script/layout.js"></script>
  </body>
</html>
