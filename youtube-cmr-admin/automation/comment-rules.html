<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/youtube-cmr-ui/css/style.css" />
    <link rel="stylesheet" href="/youtube-cmr-admin/css/admin.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

    </aside>

    <!-- Header -->
    <header class="top-header" id="top-header">

    </header>

     <main class="main-content">
      <div
        class="dashboard-header d-flex justify-content-between align-items-center mb-4 flex-wrap"
      >
        <h2 class="dashboard-title">Comment Rules</h2>

      </div>

      <!-- Categories Table -->
      <div
        class="channel-table-container p-0 overflow-hidden rounded-12 bg-white border-main"
      >
        <div class="table-responsive">
          <table class="table premium-table mb-0">
            <thead class="table-primary-head">
              <tr>
                <th class="ps-4">Name</th>
                <th>Description</th>
                <th>Reply Status</th>
                <th class="pe-4">Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- Row 1 -->
              <tr>
                <td class="ps-4">
                  <div class="fw-600 text-dark">Diwali</div>
                </td>
                <td>
                  <div class="text-muted text-truncate max-w-400">
                    Diwali
                  </div>
                </td>
                <td>
                  <span class="status-badge status-active"> Reply</span>
                </td>
                <td class="pe-4">
                  <div class="d-flex gap-2">
                    <button
                      class="btn-action text-primary-btn"
                      title="Edit"
                      data-bs-toggle="modal"
                      data-bs-target="#categoryModal"
                      onclick="
                        prepareModal(
                          'edit',
                          'RPSC ADDA',
                          'Role: You are a Human moderator for the RPSC YouTube channel.\n\nPurpose:\nevaluates the Relevance, Accuracy, and Quality of human comments left on the RPSC YouTube channel.',
                        )
                      "
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                        ></path>
                        <path
                          d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                        ></path>
                      </svg>
                    </button>
                    <button
                      class="btn-action text-danger-btn"
                      title="Disable"
                      data-bs-toggle="modal"
                      data-bs-target="#confirmationModal"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
              <!-- Row 2 -->
              <tr>
                <td class="ps-4">
                  <div class="fw-600 text-dark">RPSC ADDA</div>
                </td>
                <td>
                  <div class="text-muted">Role: You are a Human moderator for the RPSC...</div>
                </td>
                <td>
                  <span class="status-badge status-active"> Reply</span>
                </td>
                <td class="pe-4">
                  <div class="d-flex gap-2">
                    <button
                      class="btn-action text-primary-btn"
                      title="Edit"
                      data-bs-toggle="modal"
                      data-bs-target="#categoryModal"
                      onclick="prepareModal('edit', 'Diwali', 'Diwali')"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                        ></path>
                        <path
                          d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                        ></path>
                      </svg>
                    </button>
                    <button
                      class="btn-action text-danger-btn"
                      title="Disable"
                      data-bs-toggle="modal"
                      data-bs-target="#confirmationModal"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      
    <!-- Modals -->
    <!-- Add/Update Category Modal -->
    <div
      class="modal fade"
      id="categoryModal"
      tabindex="-1"
      aria-labelledby="categoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-20">
          <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
            <h5 class="modal-title fw-700 text-dark" id="categoryModalLabel">
              Comment Category Detail


            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body px-4 py-4">
            <p class="form-label mb-2 bg-light p-3 rounded-12 text-center">Diwali</p>
          </div>
        </div>
      </div>
    </div>

      <!-- Confirmation Modal -->
      <div
        class="modal fade"
        id="confirmationModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-12 border-0 shadow-lg bg-white">
            <div
              class="modal-header border-bottom px-4 py-3 bg-white rounded-top-12 d-flex justify-content-between align-items-center"
            >
              <h5 class="modal-title fw-800 text-danger m-0 fs-5">
                Confirmation Alert!
              </h5>
              <button
                type="button"
                class="btn-close shadow-none"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body px-4 py-4">
              <p
                class="text-muted mb-4 text-center px-4"
                id="confirmationModalBody"
              >
Are you sure to change the reply status of this category?

              </p>
              <div class="d-flex gap-3 mt-4">
                <button
                  type="button"
                  class="btn btn-light bg-light rounded-8 fw-600 flex-grow-1 border-main py-2-5 text-dark"
                  data-bs-dismiss="modal"
                >
                  No
                </button>
                <button
                  type="button"
                  class="btn btn-primary bg-primary border-0 shadow-sm rounded-8 flex-grow-1 fw-600 py-2-5 text-white"
                  data-bs-dismiss="modal"
                >
                  Yes
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/youtube-cmr-ui/script/script.js"></script>
    <script src="/youtube-cmr-admin/script/layout.js"></script>
  </body>
</html>
