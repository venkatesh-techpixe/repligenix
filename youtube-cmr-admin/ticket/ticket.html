<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/youtube-cmr-ui/css/style.css" />
    <link rel="stylesheet" href="/youtube-cmr-admin/css/admin.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

    </aside>

    <!-- Header -->
    <header class="top-header" id="top-header">

    </header>

<main class="main-content">
  <div class="container-fluid">

    <!-- Header -->
    <div class="dashboard-header d-flex justify-content-between align-items-center">

      <h2 class="dashboard-title">Support Ticket</h2>

      <button class="btn btn-add-new"
                  data-bs-toggle="modal"
            data-bs-target="#aboutModal"
            onclick="prepareModal('add')"
      >
        
        + Open Ticket
      </button>

    </div>

    <!-- Ticket Table Card -->
    <div class="channel-table-container p-0 overflow-hidden rounded-12">
        <div class="table-responsive">
          <table class="table premium-table mb-0">
            <thead class="table-primary-head">
            <tr>
              <th>Subject</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Last Reply</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>

          <!-- Table Body -->
          <tbody>

            <!-- Empty State -->
            <tr>
              <td colspan="5" class="text-center py-5 fw-500">
                Data not found
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


              <!-- Modals -->
      <!-- Add/Update Category Modal -->
      <div
        class="modal fade"
        id="aboutModal"
        tabindex="-1"
        aria-labelledby="aboutModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content rounded-20">
            <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
              <h5 class="modal-title fw-700 text-dark" id="aboutModalLabel">
                Open Ticket

              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body px-4 py-4">
              <form id="categoryForm">
                <div class="mb-4">
                  <label for="categoryName" class="form-label mb-2"
                    >Subject <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control premium-input shadow-none"
                    id="authorName"
                    required
                  />
                </div>
                   <div class="mb-4">
                  <label for="categoryName" class="form-label mb-2"
                    >Priority <span class="text-danger">*</span></label
                  >
                  <select class="form-select premium-input shadow-none" id="priority" required>
                    <option value="">Select Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                  </select>
                </div>
                <div class="mb-4">
                  <label for="categoryDescription" class="form-label mb-2"
                    >Message <span class="text-danger">*</span></label
                  >
                  <textarea
                    class="form-control premium-input shadow-none"
                    id="categoryDescription"
                    rows="4"
                    required
                  ></textarea>
                </div>

             <div class="mb-4">
  <label class="form-label text-dark fw-600 mb-2">
    Attach Documents
  </label>

  <!-- Upload Button -->
  <div class="d-flex align-items-center gap-3 flex-wrap">

    <label for="fileInput" class="btn btn-light border-main rounded-8 fw-600 px-3 cursor-pointer">
      + Add Document
    </label>

    <input
      type="file"
      id="fileInput"
      class="d-none"
      multiple
      accept=".jpg, .jpeg, .png, .pdf, .doc, .docx"
    />

  </div>

  <!-- File Names Preview -->
  <div id="fileList" class="mt-3 d-flex flex-column gap-2"></div>

  <!-- Info -->
  <small class="text-muted d-block mt-2 fs-0-8 fw-500">
    Max 5 files | Allowed: 
    <span class="fw-700 text-dark">.jpg, .jpeg, .png, .pdf, .doc, .docx</span>
  </small>
</div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 py-3 rounded-12 fw-600 shadow-sm border-0 bg-primary"
                >
                  Submit
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
</main>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/youtube-cmr-ui/script/script.js"></script>
    <script src="/youtube-cmr-admin/script/layout.js"></script>
  </body>
</html>
