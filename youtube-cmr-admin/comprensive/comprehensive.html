<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/youtube-cmr-ui/css/style.css" />
    <link rel="stylesheet" href="/youtube-cmr-admin/css/admin.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

    </aside>

    <!-- Header -->
    <header class="top-header" id="top-header">

    </header>

 <main class="main-content">
  <div class="container-fluid">

    <!-- Header -->
    <div class="dashboard-header d-flex justify-content-between align-items-center">
      <h2 class="dashboard-title">Comparative Analysis</h2>
    </div>

    <!-- Filters -->
    <div class="dash-card-section mb-4">

<div class="d-flex gap-3 flex-wrap flex-lg-nowrap align-items-center">
        <select class="form-select premium-input">
          <option>Select your channel</option>
            <option>Bharathstop</option>
            <option>Testing</option>
        </select>

        <input
          type="text"
          class="form-control premium-input"
          placeholder="Import Link"
        />

        <button class="btn btn-add-new">
        Compare
        </button>

      </div>

    </div>

    <!-- Table -->
    <div class="channel-table-container p-0 overflow-hidden rounded-12">
        <div class="table-responsive">
          <table class="table premium-table mb-0">
            <thead class="table-primary-head">
            <tr>
              <th>Metric</th>
              <th>Your Channel</th>
              <th class="text-end">Comparison Channel</th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <td colspan="3" class="text-center py-5 fw-500">
                Data not found
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>
</main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/youtube-cmr-ui/script/script.js"></script>
    <script src="/youtube-cmr-admin/script/layout.js"></script>
  </body>
</html>
