<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/youtube-cmr-ui/css/style.css" />
    <link rel="stylesheet" href="/youtube-cmr-admin/css/admin.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

    </aside>

    <!-- Header -->
    <header class="top-header" id="top-header">

    </header>

<main class="main-content">
  <div class="container-fluid">

    <!-- Header -->
    <div class="dashboard-header">
      <h2 class="dashboard-title">Change Password</h2>
      <p class="text-light fs-0-9 mb-0">
        Update your account password to keep your account secure
      </p>
    </div>

    <!-- Form Card -->
    <div class="dash-card-section max-w-500 mx-auto">

      <form>

        <!-- Current Password -->
        <div class="mb-3">
          <label class="form-label fw-600">Current Password <span class="text-danger">*</span></label>

          <div class="position-relative">
            <input
              type="password"
              class="form-control premium-input pe-5"
              placeholder="Enter Current Password"
            />

            <span class="position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer text-light">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label class="form-label fw-600">New Password <span class="text-danger">*</span></label>

          <div class="position-relative">
            <input
              type="password"
              class="form-control premium-input pe-5"
              placeholder="Enter New Password"
            />

            <span class="position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer text-light">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
          <label class="form-label fw-600">Confirm Password <span class="text-danger">*</span></label>

          <div class="position-relative">
            <input
              type="password"
              class="form-control premium-input pe-5"
              placeholder="Enter Confirm Password"
            />

            <span class="position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer text-light">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <!-- Button -->
        <!-- Submit Button -->
            <div class="col-12 mt-4 mb-5">
              <button
                type="submit"
                class="btn btn-confirm-yes w-100 py-3 rounded-12 fs-5 fw-bold shadow-sm transition-all hover-translate-y-n2"
              >
                Change Password
              </button>
            </div>

      </form>

    </div>

  </div>
</main>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/youtube-cmr-ui/script/script.js"></script>
    <script src="/youtube-cmr-admin/script/layout.js"></script>
  </body>
</html>
