<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/youtube-cmr-ui/css/style.css" />
    <link rel="stylesheet" href="/youtube-cmr-admin/css/admin.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

    </aside>

    <!-- Header -->
    <header class="top-header" id="top-header">

    </header>

<main class="main-content">
  <div class="container-fluid">

    <!-- Header -->
    <div class="dashboard-header">
      <h2 class="dashboard-title">Profile Settings</h2>
    </div>

    <!-- Profile Card -->
    <div class="dash-card-section mb-4">

      <div class="d-flex align-items-center gap-4 flex-wrap">

        <!-- Avatar -->
        <div class="position-relative">
          <div class="avatar-circle-big bg-light text-dark fw-700">
            ST
          </div>
        </div>

        <!-- Info -->
        <div>
          <h5 class="fw-700 mb-1">bharatshop.rajasthan@gmail.com</h5>
          <p class="mb-0 fs-0-9">sai teja</p>
        </div>

      </div>

      <!-- Info Grid -->
      <div class="row mt-4 g-3">

        <div class="col-md-4">
          <div class="border-main rounded-10 p-3">
            <div class="fs-0-85 text-muted">Location</div>
            <div class="fw-600">Hyderabad, Telangana, India</div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="border-main rounded-10 p-3">
            <div class="fs-0-85 text-muted">Email</div>
            <div class="fw-600">bharatshop.rajasthan@gmail.com</div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="border-main rounded-10 p-3">
            <div class="fs-0-85 text-muted">Phone</div>
            <div class="fw-600">918686180840</div>
          </div>
        </div>

      </div>

    </div>

    <!-- Edit Form -->
    <div class="dash-card-section">

      <h5 class="fw-700 mb-4">Edit Profile</h5>

      <form>

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">First Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control premium-input" value="sai">
          </div>

          <div class="col-md-6">
            <label class="form-label">Last Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control premium-input" value="teja">
          </div>

          <div class="col-md-6">
            <label class="form-label">Address <span class="text-danger">*</span></label>
            <input type="text" class="form-control premium-input" value="hyderabad">
          </div>

          <div class="col-md-6">
            <label class="form-label">State <span class="text-danger">*</span></label>
            <input type="text" class="form-control premium-input" value="telangana">
          </div>

          <div class="col-md-6">
            <label class="form-label">Zip Code <span class="text-danger">*</span></label>
            <input type="text" class="form-control premium-input" value="500038">
          </div>

          <div class="col-md-6">
            <label class="form-label">City <span class="text-danger">*</span></label>
            <input type="text" class="form-control premium-input" value="hyderabad">
          </div>

        </div>

        <!-- Button -->
         <!-- Submit Button -->
            <div class="col-12 mt-4 mb-5">
              <button
                type="submit"
                class="btn btn-confirm-yes w-100 py-3 rounded-12 fs-5 fw-bold shadow-sm transition-all hover-translate-y-n2"
              >
                Update Profile
              </button>
            </div>

      </form>

    </div>

  </div>
</main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/youtube-cmr-ui/script/script.js"></script>
    <script src="/youtube-cmr-admin/script/layout.js"></script>
  </body>
</html>
